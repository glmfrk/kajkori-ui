<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100">
  <defs>
    <!-- Left Stem Dark Gradient -->
    <linearGradient id="k_left_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <!-- Right Arm Dark Gradient -->
    <linearGradient id="k_right_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Speed Motion Lines -->
    <g fill="#6366F1">
      <circle cx="8" cy="42" r="5"/>
      <rect x="20" y="24" width="22" height="10" rx="5"/>
      <rect x="20" y="37" width="22" height="10" rx="5"/>
      <rect x="20" y="50" width="22" height="10" rx="5"/>
    </g>

    <!-- Base K Stem -->
    <path d="M 58 10 C 50 10 44 16 44 24 L 44 60 C 44 68 50 74 58 74 L 62 74 C 70 74 76 68 76 60 L 76 24 C 76 16 70 10 62 10 Z" fill="url(#k_left_dark)"/>
    
    <!-- Base K Diagonal Arm -->
    <path d="M 60 48 L 92 14 C 97 8 106 8 111 14 L 118 21 C 123 26 123 35 118 40 L 86 74 C 81 79 72 79 67 74 Z" fill="url(#k_right_dark)"/>

    <!-- Integrated Checkmark -->
    <path d="M 45 42 L 59 56 C 63 60 69 60 73 56 L 112 17 C 116 13 116 7 112 3 L 106 -3 C 102 -7 96 -7 92 -3 L 66 23 L 57 14 C 53 10 47 10 43 14 L 37 20 C 33 24 33 30 37 34 Z" fill="#FFFFFF" transform="translate(8, 8)"/>
  </g>

  <!-- Typography with Large Readable Tagline -->
  <text x="145" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Kaj</tspan><tspan fill="#818CF8">Kori</tspan>
  </text>
  <text x="146" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" fill="#CBD5E1">LET'S GET THE WORK DONE</text>
</svg>
