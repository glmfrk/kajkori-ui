    <path d="M 88 80 L 114 106 C 118 110 125 110 129 106 L 182 53 C 187 48 187 40 182 35 L 176 29 C 171 24 163 24 158 29 L 121 66 L 105 50 C 100 45 92 45 87 50 L 81 56 C 76 61 76 69 81 74 Z" fill="#FFFFFF"/>
