  <text x="345" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="82" font-weight="900" fill="url(#text_kori_light)" letter-spacing="-2">Kori</text>

