<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <!-- K Stem Gradient -->
    <linearGradient id="k_stem_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D124D"/>
      <stop offset="50%" stop-color="#4F17C2"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Top Arm Gradient -->
    <linearGradient id="k_arm_top_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F17C2"/>
      <stop offset="100%" stop-color="#2563EB"/>
