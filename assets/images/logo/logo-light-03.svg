  <!-- Left Speed Motion Elements -->
  <g fill="#4F17C2">
    <circle cx="28" cy="88" r="7"/>
    <rect x="44" y="61" width="30" height="13" rx="6.5"/>
    <rect x="44" y="81" width="30" height="13" rx="6.5"/>
    <rect x="44" y="101" width="30" height="13" rx="6.5"/>
  </g>

  <!-- K Icon Base Structure -->
  <g>
    <!-- Left Vertical Stem -->
    <rect x="85" y="22" width="38" height="116" rx="19" fill="url(#k_stem_light)"/>
    
    <!-- Upper Diagonal Arm -->
    <path d="M 104 78 L 158 24 C 166 16 179 16 187 24 L 188 25 C 196 33 196 46 188 54 L 138 104 Z" fill="url(#k_arm_top_light)"/>
    
