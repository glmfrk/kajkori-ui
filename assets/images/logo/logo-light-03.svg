  <text x="214" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#5A6A85" letter-spacing="5.5">LET'S GET THE WORK DONE</text>
